<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Ma'tsurat - Dzikir Pagi & Petang</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- Theme Toggle -->
    <button
      class="theme-toggle"
      onclick="toggleTheme()"
      aria-label="Toggle Theme"
    >
      <svg
        class="sun-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"
        />
      </svg>
      <svg
        class="moon-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
    </button>

    <!-- Main Container -->
    <div class="tw-container">
      <!-- Hero Card -->
      <div class="tw-card">
        <!-- Logo Section -->
        <div class="tw-logo-wrapper">
          <img
            id="logo"
            src="img/logolight.svg"
            alt="Al-Ma'tsurat Logo"
            class="tw-logo"
          />
          <!-- <h1 class="tw-title">Al-Ma'tsurat</h1>
          <p class="tw-subtitle">Dzikir Pagi & Petang</p> -->
        </div>

        <!-- Menu Grid -->
        <div class="tw-menu-grid">
          <a href="dzikirpagi.html" class="tw-btn tw-btn-primary">
            <div class="tw-btn-icon-wrapper">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"
                />
              </svg>
            </div>
            <div class="tw-btn-content">
              <span class="tw-btn-title">Dzikir Pagi</span>
              <span class="tw-btn-desc">Bacaan pagi hari</span>
            </div>
          </a>

          <a href="dzikirpetang.html" class="tw-btn tw-btn-secondary">
            <div class="tw-btn-icon-wrapper">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </div>
            <div class="tw-btn-content">
              <span class="tw-btn-title">Dzikir Petang</span>
              <span class="tw-btn-desc">Bacaan sore hari</span>
            </div>
          </a>
        </div>

        <!-- Action Buttons -->
        <div class="tw-action-buttons">
          <a href="about.html" class="tw-btn-outline">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              fill="currentColor"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
              />
              <path
                d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"
              />
            </svg>
            <span>Tentang</span>
          </a>
          <button onclick="exitFromApp()" class="tw-btn-outline tw-btn-danger">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14l5-5-5-5m5 5H9"
              />
            </svg>
            <span>Keluar</span>
          </button>
        </div>

        <!-- Footer -->
        <div class="tw-footer">
          <p>versi 1.1.0</p>
        </div>
      </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/ripplet-declarative.min.js"></script>
    <script>
      function toggleTheme() {
        const html = document.documentElement;
        const logo = document.getElementById("logo");
        const currentTheme = html.getAttribute("data-theme");

        if (currentTheme === "light") {
          html.setAttribute("data-theme", "dark");
          logo.src = "img/logodark.svg";
          localStorage.setItem("theme", "dark");
        } else {
          html.setAttribute("data-theme", "light");
          logo.src = "img/logolight.svg";
          localStorage.setItem("theme", "light");
        }
      }

      // Load saved theme
      window.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme") || "light";
        const logo = document.getElementById("logo");
        document.documentElement.setAttribute("data-theme", savedTheme);
        logo.src =
          savedTheme === "dark" ? "img/logodark.svg" : "img/logolight.svg";
      });

      function exitFromApp() {
        if (confirm("Apakah kamu yakin untuk keluar?")) {
          navigator.app.exitApp();
        }
      }
    </script>
  </body>
</html>
