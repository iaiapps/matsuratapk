<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dzikir Petang - Matsurat</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <!-- Sticky Header -->
    <header class="reading-header">
      <div class="header-top">
        <a href="index.html" class="back-button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5m7 7l-7-7 7-7" />
          </svg>
        </a>
        <h2 class="page-title">Dzikir Petang</h2>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="search-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="Cari dzikir..." />
        <ul id="search-list" class="search-list"></ul>
      </div>
    </header>

    <!-- Main Reading Content -->
    <main class="reading-content">
      <h3 id="judul" class="dzikir-title">Memuat...</h3>
      <div id="arab" class="dzikir-arabic">Memuat dzikir...</div>
      <details class="dzikir-translation">
        <summary>Lihat Artinya</summary>
        <p id="trans">Memuat terjemahan...</p>
      </details>
    </main>

    <!-- Sticky Footer -->
    <footer class="reading-footer">
      <button class="btn-nav" id="prev">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
        <span>Sebelumnya</span>
      </button>
      <span id="counter" class="dzikir-counter">1 / 1</span>
      <button class="btn-nav" id="next">
        <span>Selanjutnya</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    </footer>

    <script src="js/axios.min.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/dzikrpetang.js"></script>
  </body>
</html>
